<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Superviseur</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #030712; --card: #0b0f19; --border: #111827; --primary: #1e40af; --text: #f3f4f6; --text-muted: #6b7280;
            --google-display: 'Google Sans Display', 'Product Sans', 'Roboto', sans-serif;
            --google-text: 'Google Sans Text', 'Product Sans', 'Roboto', sans-serif;
        }
        body { font-family: var(--google-text); background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin:0; -webkit-font-smoothing: antialiased; }
        .auth-card { background: var(--card); width: 100%; max-width: 380px; padding: 40px 35px; border-radius: 20px; border: 1px solid #1f2937; box-shadow: 0 0 50px rgba(0,0,0,0.6), 0 0 20px rgba(30, 64, 175, 0.2); box-sizing: border-box; }
        h2 { color: #38bdf8; margin:0 0 5px 0; text-align:center; font-size:22px; font-family: var(--google-display); font-weight: 700; letter-spacing: -0.5px; }
        p { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 25px; }
        label { display:block; font-size:11px; margin-bottom:6px; color:#9ca3af; font-weight:600; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px; border: 1px solid #1f2937; border-radius: 10px; margin-bottom: 18px; background: #030712; color: white; box-sizing: border-box; font-family: var(--google-text); font-size: 14px; }
        input:focus { border-color: #38bdf8; outline: none; box-shadow: 0 0 8px rgba(56, 189, 248, 0.2); }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #1e40af, #2563eb); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 500; font-size: 15px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3); }
        .btn:hover { background: linear-gradient(135deg, #1d4ed8, #3b82f6); transform: translateY(-1px); }
        .back-link { display:block; text-align:center; color:#4b5563; font-size:13px; margin-top:20px; text-decoration:none; transition: color 0.2s; }
        .back-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2> GESTIONNAIRE</h2>
        <label>Identifiant DU gestionnaire</label>
        <input type="text" id="admin-user" placeholder="    ">
        <label>Mot de passe secret</label>
        <input type="password" id="admin-pass" placeholder="...........">
        <button class="btn" onclick="loginAdmin()">Connexion</button>
        <a href="/index.html" class="back-link"> Portail Habitants</a>
    </div>
    <script>
        async function loginAdmin() {
            const username = document.getElementById('admin-user').value;
            const password = document.getElementById('admin-pass').value;
            try {
                const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
                const d = await r.json();
                if (r.ok && d.role === 'ADMIN') {
                    localStorage.setItem('token', d.token); localStorage.setItem('username', d.username);
                    localStorage.setItem('role', d.role); localStorage.setItem('photoUrl', d.photoUrl);
                    window.location.href = '/admin.html';
                } else alert("Droits d'administration requis.");
            } catch (err) { console.error(err); }
        }
    </script>
</body>
</html>
